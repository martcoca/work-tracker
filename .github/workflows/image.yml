name: Image

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect container
    runs-on: ubuntu-latest
    # A job with no cap can burn to GitHub's 6-hour default. One did: 4h19m.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Prove delivery builds once and carries the inspected digest
        run: scripts/deploy/check-workflow.sh

      - name: Build production image
        run: docker build --tag work-tracker:check .

      - name: Prove minimal non-root layers and credential refusal
        run: scripts/container/check-image.sh work-tracker:check

      - name: Serve verified fixture exports through the production image
        run: scripts/container/check-runtime.sh work-tracker:check
