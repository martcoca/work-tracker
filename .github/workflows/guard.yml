name: Guard

# Repository-contract checks that are not any packet's job. A packet adds its own test
# job; this one exists from the first commit so the contract is never unenforced.

on:
  pull_request:
  push:
    branches: [main]
  # Required: an auto-merge push raises no events, so this must be dispatchable.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Packet integrity
        if: github.event_name == 'pull_request'
        run: >-
          scripts/check-packet-integrity.sh
          "${{ github.event.pull_request.base.sha }}"

      - name: Workflow permissions are explicit
        run: scripts/check-workflow-permissions.sh

      - name: A completed packet arrives with its evidence
        if: github.event_name == 'pull_request'
        run: scripts/check-evidence.sh "${{ github.event.pull_request.base.sha }}"

      - name: Auto-merge awaits every workflow
        run: scripts/check-automerge-coverage.sh

      - name: Push workflows are dispatchable after an auto-merge
        run: scripts/post-merge-workflows.sh check

      - name: Shell scripts parse
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r s; do
            bash -n "$s"
            echo "parsed $s"
            found=$((found + 1))
          done < <(find scripts -name '*.sh' -type f | sort)
          [ "$found" -gt 0 ] || { echo "no shell scripts found"; exit 1; }

  packet-model:
    name: Packet model
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Test offline
        env:
          GOWORK: "off"
          GOPROXY: "off"
        run: go test ./...

      - name: Vet offline
        env:
          GOWORK: "off"
          GOPROXY: "off"
        run: go vet ./...

      - name: Require every model mutant to be killed
        env:
          GOWORK: "off"
          GOPROXY: "off"
        run: go run ./internal/mutationgate
