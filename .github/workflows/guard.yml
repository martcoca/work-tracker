name: Guard

# Repository-contract checks that are not any packet's job. A packet adds its own test
# job; this one exists from the first commit so the contract is never unenforced.

on:
  pull_request:
  push:
    branches: [main]
  # Required: an auto-merge push raises no events, so this must be dispatchable.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  contract:
    name: Repository contract
    runs-on: ubuntu-latest
    # A job with no cap can burn to GitHub's 6-hour default. One did: 4h19m.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Packet integrity
        if: github.event_name == 'pull_request'
        run: >-
          scripts/check-packet-integrity.sh
          "${{ github.event.pull_request.base.sha }}"

      - name: Nothing forbidden can be committed
        run: scripts/check-ignore-contract.sh

      - name: Workflow permissions are explicit
        run: scripts/check-workflow-permissions.sh

      - name: A completed packet arrives with its evidence
        if: github.event_name == 'pull_request'
        run: scripts/check-evidence.sh "${{ github.event.pull_request.base.sha }}"

      - name: The packet index agrees with the packets
        run: scripts/check-packet-index.sh

      - name: Auto-merge awaits every workflow
        run: scripts/check-automerge-coverage.sh

      - name: Push workflows are dispatchable after an auto-merge
        run: scripts/post-merge-workflows.sh check

      - name: Shell scripts parse
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r s; do
            bash -n "$s"
            echo "parsed $s"
            found=$((found + 1))
          done < <(find scripts -name '*.sh' -type f | sort)
          [ "$found" -gt 0 ] || { echo "no shell scripts found"; exit 1; }

  packet-model:
    name: Packet model
    runs-on: ubuntu-latest
    # A job with no cap can burn to GitHub's 6-hour default. One did: 4h19m.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Test offline
        env:
          GOWORK: "off"
          GOPROXY: "off"
        run: go test ./...

      - name: Vet offline
        env:
          GOWORK: "off"
          GOPROXY: "off"
        run: go vet ./...

  human-surface:
    name: Read-only human surface
    runs-on: ubuntu-latest
    # A job with no cap can burn to GitHub's 6-hour default. One did: 4h19m.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Test navigation and accessibility
        run: npm test

      - name: Build production surface
        run: npm run build

  infrastructure-plans:
    name: Unapplied infrastructure plans
    runs-on: ubuntu-latest
    # A job with no cap can burn to GitHub's 6-hour default. One did: 4h19m.
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - name: Initialize every root without a backend
        run: |
          set -euo pipefail
          for root in identity deploy trust; do
            tofu -chdir="infra/$root" init -backend=false
          done

      - name: Check formatting and provider schemas
        run: |
          set -euo pipefail
          tofu fmt -check -recursive infra
          for root in identity deploy trust; do
            tofu -chdir="infra/$root" validate
          done

      - name: Test plan and trust assertions with mock providers
        run: |
          set -euo pipefail
          for root in identity deploy trust; do
            tofu -chdir="infra/$root" test -no-color
          done

      - name: Produce and guard a backend-free synthetic foundation plan
        run: scripts/cloud/gcp/check-foundation-plan.sh
