name: Guard

# Repository-contract checks that are not any packet's job. A packet adds its own test
# job; this one exists from the first commit so the contract is never unenforced.

on:
  pull_request:
  push:
    branches: [main]
  # Required: an auto-merge push raises no events, so this must be dispatchable.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Repository contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Packet integrity
        if: github.event_name == 'pull_request'
        run: >-
          scripts/check-packet-integrity.sh
          "${{ github.event.pull_request.base.sha }}"

      - name: Workflow permissions are explicit
        run: scripts/check-workflow-permissions.sh

      - name: A completed packet arrives with its evidence
        if: github.event_name == 'pull_request'
        run: scripts/check-evidence.sh "${{ github.event.pull_request.base.sha }}"

      - name: The packet index agrees with the packets
        run: scripts/check-packet-index.sh

      - name: Auto-merge awaits every workflow
        run: scripts/check-automerge-coverage.sh

      - name: Push workflows are dispatchable after an auto-merge
        run: scripts/post-merge-workflows.sh check

      - name: Shell scripts parse
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r s; do
            bash -n "$s"
            echo "parsed $s"
            found=$((found + 1))
          done < <(find scripts -name '*.sh' -type f | sort)
          [ "$found" -gt 0 ] || { echo "no shell scripts found"; exit 1; }

  packet-model:
    name: Packet model
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Test offline
        env:
          GOWORK: "off"
          GOPROXY: "off"
        run: go test ./...

      - name: Vet offline
        env:
          GOWORK: "off"
          GOPROXY: "off"
        run: go vet ./...

      - name: Require every domain and read-path mutant to be killed
        env:
          GOWORK: "off"
          GOPROXY: "off"
        run: go run ./internal/mutationgate

  human-surface:
    name: Read-only human surface
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Test navigation and accessibility
        run: npm test

      - name: Build production surface
        run: npm run build

  identity-plan:
    name: Unapplied identity plan
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: .opentofu-version
          tofu_wrapper: false

      - name: Initialize without backend
        run: tofu -chdir=infra/identity init -backend=false

      - name: Check formatting and provider schema
        run: |
          tofu -chdir=infra/identity fmt -check -recursive
          tofu -chdir=infra/identity validate

      - name: Test plan assertions with mock providers
        run: tofu -chdir=infra/identity test -no-color

      - name: Produce refresh-disabled synthetic plan
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: synthetic-ci-not-a-credential
        run: >-
          tofu -chdir=infra/identity plan
          -refresh=false -input=false -lock=false -no-color
          -var-file=../../config/example/identity.tfvars
          -out=/tmp/work-tracker-identity.tfplan

      - name: Prove idle cost is zero
        run: scripts/cloud/gcp/cost-guard.sh /tmp/work-tracker-identity.tfplan
